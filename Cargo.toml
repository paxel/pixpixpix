[package]
name = "pixpixpix"
version = "0.3.1"
edition = "2024"
description = "Fast keyboard-first image and video viewer for Linux and macOS"
license = "MIT"
repository = "https://github.com/paxel/pixpixpix"
default-run = "pixpixpix"

[[bin]]
name = "pixpixpix"
path = "src/main.rs"

[[bin]]
name = "pix3"
path = "src/bin/pix3.rs"

[lints.rust]
# Unsafe is denied crate-wide; only the dynamic-library adapter may opt in with
# `#[expect(unsafe_code, reason = "…")]`.
unsafe_code = "deny"

[lints.clippy]
# No-panic policy, as in whiteboxed. Test code is exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# No-`#[allow]` policy: fix the lint instead of silencing it.
allow_attributes = "deny"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5"
directories = "6"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
epaint_default_fonts = "0.35"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
image-webp = "0.2"
kamadak-exif = "0.6"
libloading = "0.8"
md5 = "0.8"
notify = "8.2"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
skrifa = { version = "0.42", default-features = false, features = ["std"] }
toml = "0.9"
tempfile = "3"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
trash = "5.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "AE", "AEDataModel", "AppleEvents", "LaunchServices", "LSInfo", "LSConstants"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-services", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSData", "NSError", "NSFileManager", "NSNotification", "NSObject", "NSString", "NSURL"] }

[dev-dependencies]
egui_kittest = "0.35"

[profile.release]
lto = "thin"
codegen-units = 1

# Decoding in debug builds is too slow to judge the app by.
[profile.dev.package."*"]
opt-level = 3
