name: Fuzz

# The fuzz targets in fuzz/ (cargo-fuzz, libFuzzer), weekly and by hand, from paxel/gates: the
# parsers that compute offsets and lengths in untrusted files. A crash fails the job;
# `cargo fuzz run <target> <file>` replays its input.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@d22bf6e88b4412ff8281ff48963917843abf494f # v1.1.1
    with:
      stack: rust
      # A fuzzer finds more the longer it runs: a quarter of an hour per target.
      seconds: 900
      targets: |
        multi_picture
        reset_orientation
        motion_find
