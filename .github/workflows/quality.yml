# The coverage ratchet and the SonarQube Cloud analysis. The fmt, clippy and
# test gate per platform is ci.yml.
name: Quality

on:
  # Pushes only to summer, which takes nothing but pull request merges. Every
  # other branch is tested by its pull request run.
  push:
    branches: [summer]
  pull_request:

# A newer push or pull request update cancels the older run of the same branch.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The token only reads the code: no job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The ratchet: line coverage may only go up. The floor lives in .coverage-floor;
  # a change that lowers coverage fails here, and a change that raises it is
  # expected to raise the floor in the same pull request (scripts/coverage.sh does
  # that when run locally).
  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every library the tests can load, so the measurement takes the same
      # branches on every run.
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libturbojpeg libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libmpv2
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-tarpaulin
      - name: Enforce the floor
        run: scripts/coverage.sh --check
      - name: Upload the coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # SonarQube Cloud analysis of summer; the free plan analyses the main branch
  # only. Report only: the quality gate shows on
  # https://sonarcloud.io/summary/new_code?id=paxel_pixpixpix and fails no build.
  # What is analysed is in sonar-project.properties.
  #
  # Only pushes to summer run it, so the token never meets code from a pull
  # request, and it analyses the commit this run checked out. It runs after the
  # coverage job, also when that failed, and takes its LCOV file from this run;
  # without one the scan has no coverage.
  sonar:
    name: SonarQube Cloud analysis
    needs: [coverage]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/summer' }}
    runs-on: ubuntu-24.04
    steps:
      # The full history for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy report for the analyzer
        run: |
          mkdir -p build
          cargo clippy --all-targets --locked --message-format=json > build/clippy-report.json
      - name: Rust coverage from the coverage job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: build
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
