name: CI

# pixpixpix's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate
# on Linux x86_64 (format, lint set, clippy, tests, coverage ratchet) and SonarQube Cloud.
# The Rust gate tests on one system only and installs no Homebrew packages, so the lanes for
# Linux aarch64 and macOS arm64 are pixpixpix's own (docs/adr/0001-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@c3bbaf3526aaa668e256f8a05f78853564fd1217 # v1.1.0

  rust:
    uses: paxel/gates/.github/workflows/rust.yml@c3bbaf3526aaa668e256f8a05f78853564fd1217 # v1.1.0
    with:
      apt-packages: libturbojpeg libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libmpv2
      # The helper processes the tests start write their profile on the way out; without the
      # delay tarpaulin merges a profile still being written and fails on it.
      coverage: rust --post-test-delay 2

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libturbojpeg libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libmpv2
      - name: Native libraries (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install jpeg-turbo libheif mpv
      - name: Format
        run: cargo fmt --check
      # The two clippy runs of the shared Rust gate: shipped code under the whole lint set,
      # tests with the lints allowed that are how a test fails.
      - name: Clippy on shipped code
        run: cargo clippy --locked --all-features -- -D warnings
      - name: Clippy on tests
        run: >-
          cargo clippy --locked --tests --benches --examples --all-features -- -D warnings
          -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing
          -A clippy::string_slice -A clippy::arithmetic_side_effects -A clippy::unreachable
      - name: Tests
        run: cargo test --locked --all-features

  sonar:
    needs: rust
    uses: paxel/gates/.github/workflows/sonar.yml@c3bbaf3526aaa668e256f8a05f78853564fd1217 # v1.1.0
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
