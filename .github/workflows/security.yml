# Checks the dependencies with cargo deny (deny.toml): a known vulnerability
# (RustSec) or a licence that is not allowed fails it. Runs on every push and
# pull request, and weekly, because new advisories appear without any change
# here. Unmaintained or yanked crates are reported but never fail it.
name: Security

on:
  push:
    branches: [summer]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories and licences (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
