# Checks the dependencies with cargo deny (deny.toml): a known vulnerability
# (RustSec) or a licence that is not allowed fails it. Runs on every push and
# pull request, and weekly, because new advisories appear without any change
# here. Unmaintained or yanked crates are reported but never fail it.
name: Security

on:
  push:
    branches: [summer]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories and licences (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
