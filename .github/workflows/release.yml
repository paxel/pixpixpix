# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate     - paxel/gates release-gate.yml: no open alert or SonarQube Cloud finding that
#              is not accepted, no known vulnerability, no licence outside the allowlist,
#              and a CHANGELOG section for the version
#   test     - tag matches the crate version, then format, clippy and every test on the
#              tagged commit, with the native libraries installed
#   build    - per target a flat tar.gz with pixpixpix, pix3, LICENSE, README.md
#              and CHANGELOG.md: linux-x86_64, linux-aarch64 (built natively on
#              the arm runner) and macos-arm64; the Linux ones also carry the
#              launcher entry, the icons and install-icon.sh for the formula;
#              macOS also packs pixpixpix.app with libmpv bundled, zipped for
#              the cask (packaging/macos/pack.sh)
#   flatpak  - per architecture a Flatpak bundle, pixpixpix-<ver>-x86_64.flatpak
#              and -aarch64.flatpak, from the Linux tarball's binary and libmpv
#              built in flatpak-builder (packaging/flatpak), natively on each runner
#   provenance - paxel/gates provenance.yml: a CycloneDX SBOM of the source, signed build
#              provenance for every file and its Sigstore bundle as a file of its own
#   release  - GitHub Release, notes = the CHANGELOG section for the tag, with every file
#              of the jobs before
#   tap      - renders the Linux formula and the macOS cask with the artifacts'
#              checksums and pushes them to paxel/homebrew-tap as
#              Formula/pixpixpix.rb and Casks/pixpixpix.rb (CHANNEL_PAT)
#
# packaging/flatpak/install.sh installs the latest release's bundle.
#
# Run by hand ("Run workflow") it is a dry run: gate, test, build and flatpak run for
# the tag entered and leave their files on the run; provenance, release and tap only
# run with "publish" on.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish (release, tap); off = dry run"
        type: boolean
        default: false

# Least privilege: the job that writes the GitHub Release widens this itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@c3bbaf3526aaa668e256f8a05f78853564fd1217 # v1.1.0
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  # The shared gate runs no tests. A tag can sit on any commit, so the tagged one is tested
  # here once more before anything is built from it (docs/adr/0001-move-to-gates.md).
  test:
    name: Tests on the tagged commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libturbojpeg libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libmpv2
      - run: cargo fmt --check
      - name: Clippy on shipped code
        run: cargo clippy --locked --all-features -- -D warnings
      - name: Clippy on tests
        run: >-
          cargo clippy --locked --tests --benches --examples --all-features -- -D warnings
          -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing
          -A clippy::string_slice -A clippy::arithmetic_side_effects -A clippy::unreachable
      - run: cargo test --locked --all-features

  build:
    name: Artifacts (${{ matrix.platform }})
    needs: [gate, test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binaries
        run: cargo build --locked --release
      - name: Tarball (flat)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist bundle
          cp target/release/pixpixpix target/release/pix3 LICENSE README.md CHANGELOG.md bundle/
          if [ "$RUNNER_OS" = Linux ]; then
            cp packaging/linux/io.github.paxel.pixpixpix.desktop packaging/linux/install-icon.sh \
              assets/icon/icon_256.png assets/icon/icon.svg bundle/
          fi
          tar -C bundle -czf "dist/pixpixpix-${ver}-${{ matrix.platform }}.tar.gz" .
      - name: pixpixpix.app (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv dylibbundler librsvg
          packaging/macos/pack.sh "${RELEASE_TAG#v}" target/release dist
      # dist-*: the artifacts the provenance job collects.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # The image's runtimes sit on a lower overlay layer, where updating them
      # fails with "Invalid cross-device link"; a volume holds a copy instead.
      options: --privileged --volume /var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - name: The release binary where the manifest takes it from
        id: ver
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p target/release
          tar -C target/release -xzf "dist/pixpixpix-${ver}-linux-${{ matrix.arch }}.tar.gz" ./pixpixpix
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.paxel.pixpixpix.yml
          bundle: pixpixpix-${{ steps.ver.outputs.ver }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-flatpak-${{ matrix.arch }}
          path: pixpixpix-${{ steps.ver.outputs.ver }}-${{ matrix.arch }}.flatpak

  # A CycloneDX SBOM of the source, signed build provenance for every file
  # (`gh attestation verify <file> --repo paxel/pixpixpix`) and the Sigstore bundle as a
  # file of its own, for verification without GitHub's API. Not in a dry run: an
  # attestation is public and permanent.
  provenance:
    needs: [build, flatpak]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    uses: paxel/gates/.github/workflows/provenance.yml@c3bbaf3526aaa668e256f8a05f78853564fd1217 # v1.1.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: pixpixpix
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file of the build jobs, with the SBOM and the Sigstore bundle beside them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent - a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "pixpixpix $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "pixpixpix $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  # Only after the Release exists: the formula points at its assets.
  tap:
    name: Homebrew tap (Linux formula, macOS cask)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render the formula and the cask with the artifacts' checksums
        run: |
          packaging/render-formula.sh "${RELEASE_TAG#v}" dist out
          packaging/render-cask.sh "${RELEASE_TAG#v}" dist out
      - name: Push to the tap (a rerun with nothing new pushes nothing)
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "pixpixpix-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp out/pixpixpix.rb tap/Formula/pixpixpix.rb
          cp out/pixpixpix-cask.rb tap/Casks/pixpixpix.rb
          git -C tap add Formula/pixpixpix.rb Casks/pixpixpix.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula/pixpixpix.rb and Casks/pixpixpix.rb are already current"
          else
            git -C tap commit -m "pixpixpix $ver"
            git -C tap push
          fi
