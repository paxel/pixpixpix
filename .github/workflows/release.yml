# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate     - tag matches the crate version, then the full Linux gate
#   build    - per target a flat tar.gz with pixpixpix, pix3, LICENSE, README.md
#              and CHANGELOG.md: linux-x86_64, linux-aarch64 (built natively on
#              the arm runner) and macos-arm64; the Linux ones also carry the
#              launcher entry, the icons and install-icon.sh for the formula;
#              macOS also packs pixpixpix.app with libmpv bundled, zipped for
#              the cask (packaging/macos/pack.sh)
#   flatpak  - per architecture a Flatpak bundle, pixpixpix-<ver>-x86_64.flatpak
#              and -aarch64.flatpak, from the Linux tarball's binary and libmpv
#              built in flatpak-builder (packaging/flatpak), natively on each runner
#   release  - GitHub Release, notes = the CHANGELOG section for the tag
#   tap      - renders the Linux formula and the macOS cask with the artifacts'
#              checksums and pushes them to paxel/homebrew-tap as
#              Formula/pixpixpix.rb and Casks/pixpixpix.rb (CHANNEL_PAT)
#
# packaging/flatpak/install.sh installs the latest release's bundle.
#
# Run by hand ("Run workflow") it is a dry run: gate, build and flatpak run for
# the tag entered and leave their files on the run; release and tap only run
# with "publish" on.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish (release, tap); off = dry run"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libturbojpeg libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libmpv2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Artifacts (${{ matrix.platform }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binaries
        run: cargo build --release
      - name: Tarball (flat)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist bundle
          cp target/release/pixpixpix target/release/pix3 LICENSE README.md CHANGELOG.md bundle/
          if [ "$RUNNER_OS" = Linux ]; then
            cp packaging/linux/io.github.paxel.pixpixpix.desktop packaging/linux/install-icon.sh \
              assets/icon/icon_256.png assets/icon/icon.svg bundle/
          fi
          tar -C bundle -czf "dist/pixpixpix-${ver}-${{ matrix.platform }}.tar.gz" .
      - name: pixpixpix.app (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv dylibbundler librsvg
          packaging/macos/pack.sh "${RELEASE_TAG#v}" target/release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: The release binary where the manifest takes it from
        id: ver
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p target/release
          tar -C target/release -xzf "dist/pixpixpix-${ver}-linux-${{ matrix.arch }}.tar.gz" ./pixpixpix
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.paxel.pixpixpix.yml
          bundle: pixpixpix-${{ steps.ver.outputs.ver }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: pixpixpix-${{ steps.ver.outputs.ver }}-${{ matrix.arch }}.flatpak

  release:
    name: GitHub Release
    needs: [build, flatpak]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent - a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "pixpixpix $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "pixpixpix $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  # Only after the Release exists: the formula points at its assets.
  tap:
    name: Homebrew tap (Linux formula, macOS cask)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula and the cask with the artifacts' checksums
        run: |
          packaging/render-formula.sh "${RELEASE_TAG#v}" dist out
          packaging/render-cask.sh "${RELEASE_TAG#v}" dist out
      - name: Push to the tap (a rerun with nothing new pushes nothing)
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "pixpixpix-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp out/pixpixpix.rb tap/Formula/pixpixpix.rb
          cp out/pixpixpix-cask.rb tap/Casks/pixpixpix.rb
          git -C tap add Formula/pixpixpix.rb Casks/pixpixpix.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula/pixpixpix.rb and Casks/pixpixpix.rb are already current"
          else
            git -C tap commit -m "pixpixpix $ver"
            git -C tap push
          fi
