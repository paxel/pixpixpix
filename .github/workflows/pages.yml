# Builds the documentation site (site/ -> site-dist/) on every push to summer,
# every pull request and every release tag; deploys it to GitHub Pages only
# for release tags, so the site always describes a released version. The
# build fails on a broken link or a release without its changelog section.
#
# One-time steps in the repository settings, done by the owner:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      tags matching "v*" (the deploy job runs only on those).
name: Pages

on:
  push:
    branches: [summer]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the site build
        run: node --test "tool/site/*.test.js"

      - name: Build the site
        run: node tool/site/build.js --base "/${{ github.event.repository.name }}/"

      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version ($expected); the site would describe the wrong release"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
