# The Flatpak bundle attached to each release (.github/workflows/release.yml).
#
# The app module packages the release binary, which CI unpacks from the Linux
# tarball into target/release first; locally `cargo build --release` puts it
# there:
#
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     build-dir packaging/flatpak/io.github.paxel.pixpixpix.yml
#
# The runtime brings libturbojpeg, libheif (AVIF built in, the HEIC plugin
# through its codecs-extra extension) and ffmpeg. libmpv is not in it and is
# built here with libass and libplacebo, as Flathub's Celluloid does; it makes
# the bundle GPL licensed.
app-id: io.github.paxel.pixpixpix
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: pixpixpix
# Flatpak exports only icons named after the app id.
rename-icon: pixpixpix
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
modules:
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  # Only the library: pixpixpix draws mpv's frames itself.
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dalsa=disabled
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # The binary goes to libexec; the command in bin is pixpixpix.sh.
  - name: pixpixpix
    buildsystem: simple
    build-commands:
      - install -Dm755 pixpixpix /app/libexec/pixpixpix
      - install -Dm755 pixpixpix.sh /app/bin/pixpixpix
      - install -Dm644 io.github.paxel.pixpixpix.desktop /app/share/applications/io.github.paxel.pixpixpix.desktop
      - install -Dm644 icon_256.png /app/share/icons/hicolor/256x256/apps/pixpixpix.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/pixpixpix.svg
      - install -Dm644 io.github.paxel.pixpixpix.metainfo.xml /app/share/metainfo/io.github.paxel.pixpixpix.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/pixpixpix
      - type: file
        path: pixpixpix.sh
      - type: file
        path: ../linux/io.github.paxel.pixpixpix.desktop
      - type: file
        path: ../../assets/icon/icon_256.png
      - type: file
        path: ../../assets/icon/icon.svg
      - type: file
        path: io.github.paxel.pixpixpix.metainfo.xml
