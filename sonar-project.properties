# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_pixpixpix
# Analysed by the sonar job of .github/workflows/quality.yml on pushes to summer.
sonar.organization=paxel
sonar.projectKey=paxel_pixpixpix
sonar.projectName=pixpixpix

# Everything in the repository is a source except the tests; sources and tests may not
# overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Built output, test fixtures and local leftovers.
sonar.exclusions=tests/**,\
  target/**,\
  build/**,\
  site-dist/**,\
  fuzz/target/**,\
  fuzz/corpus/**,\
  fuzz/artifacts/**,\
  .claude_here/**
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: the tarpaulin run of the coverage job writes lcov.info, which the workflow
# downloads into build/.
sonar.rust.lcov.reportPaths=build/lcov.info

# Only the Rust code has a coverage measurement: the fuzz targets run under cargo-fuzz,
# the site build and its tests under node.
sonar.coverage.exclusions=fuzz/**,\
  tool/**,\
  site/**
