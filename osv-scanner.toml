# osv-scanner's exceptions, read by the OSV gate (paxel/gates vulns.yml). Each one says why
# the repository is not exposed and why no update removes it, and carries a date; when the
# date passes, the gate fails again: that is the review.
#
# An advisory:
# [[IgnoredVulns]]
# id = "RUSTSEC-2026-0000"
# ignoreUntil = 2027-05-14
# reason = "..."
#
# A licence outside the standard's allowlist (one package):
# [[PackageOverrides]]
# name = "some-crate"
# ecosystem = "crates.io"
# license.ignore = true
# effectiveUntil = 2027-05-14
# reason = "..."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-02-14
reason = """An unmaintained notice, no vulnerability: zvariant comes through eframe's accesskit feature \
(accesskit_unix on zbus 5). accesskit_unix and atspi have no release on zbus 6 yet, and dropping \
the feature would take screen-reader support away."""

