[[PackageOverrides]]
name = "trash"
ecosystem = "crates.io"
version = "5.4.0"
license.ignore = true
effectiveUntil = 2026-12-17
reason = """MIT per crates.io, like every release before it. 5.4.0 was published on 2026-11-17 and \
