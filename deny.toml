# cargo deny, run by .github/workflows/security.yml: RustSec advisories for the
# dependencies, their licences and their sources. A vulnerability, an
# unmaintained or unsound crate and a yanked version all fail the check: they are
# findings, not footnotes. An exception is an entry in `ignore` below, with its
# reason.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Unsound crates anywhere in the tree, not only the ones this crate depends on
# directly (cargo deny's default).
unsound = "all"
ignore = [
    # zbus_names, zvariant and zvariant_derive were merged into zbus 6. They come
    # in through eframe's accessibility support: accesskit_unix 0.24 and atspi 0.30,
    # the latest releases, still need zbus 5. Drop these when they move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via eframe/accesskit_unix on zbus 5; atspi and accesskit_unix have no release on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via eframe/accesskit_unix on zbus 5; atspi and accesskit_unix have no release on zbus 6 yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via eframe/accesskit_unix on zbus 5; atspi and accesskit_unix have no release on zbus 6 yet" },
]

[licenses]
# Permissive licences, and MPL-2.0, whose copyleft stays with its own files.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
